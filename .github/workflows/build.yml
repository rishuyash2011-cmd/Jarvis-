name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: unzip -q -o ./*.zip -d src
      - run: if [ -d overrides ]; then cp -r overrides/. src/jarvis-android/; fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: cd src/jarvis-android && gradle assembleDebug --no-daemon
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ github.run_number }}" src/jarvis-android/app/build/outputs/apk/debug/app-debug.apk --title "Jarvis ${{ github.run_number }}"
